spring.application.name=SeatReservation

# Database Connection URL (Replace 'your_database_name' with your schema name)
spring.datasource.url=jdbc:mysql://localhost:3306/seat_reservation?useSSL=false&serverTimezone=UTC
# Forces the database driver to give up after 5 seconds instead of hanging forever
spring.jpa.properties.jakarta.persistence.query.timeout=5000

# Database Credentials
spring.datasource.username=root
spring.datasource.password=Deva@457

# JPA & InnoDB Dialect Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# HikariCP Connection Pool tuning for high concurrency
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=5000


# Expose health and metrics endpoints for Prometheus scraping
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always

# Enable database readiness/liveness health probes
management.health.db.enabled=true
